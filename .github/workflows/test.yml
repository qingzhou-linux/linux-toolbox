name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check Bash syntax
        run: |
          bash -n src/*.sh
          bash -n src/lib/*.sh
          bash -n tests/*.sh

      - name: Run ShellCheck
        run: |
          shellcheck src/*.sh
          shellcheck src/lib/*.sh
          shellcheck tests/*.sh

      - name: Run tests
        run: bash tests/run_test.sh
